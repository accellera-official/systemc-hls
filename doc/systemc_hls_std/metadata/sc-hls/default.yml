description: "High-level synthesis (HLS) tools translate behavioral or partially timed SystemC models into register-transfer level (RTL) implementations. This standard defines the minimum ISO C++17 and IEEE Std 1666 SystemC syntax subset to be supported by HLS tools, the standard input code structures that generate specific RTL structures, and the expected output structures in the generated RTL. It also defines a library of communication and synchronization components for HLS-based designs. With this standard, hardware designers can create SystemC designs that are portable among all conforming HLS tools. The standard does not restrict a tool's support for syntax beyond the subset, including vendor-specific design and library components."
